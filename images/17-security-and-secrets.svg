<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1f" />
      <stop offset="100%" stop-color="#241438" />
    </linearGradient>
    <filter id="shadow17" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg17)" />

  <text x="480" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">🛡️ Terraform Security &amp; Secrets Management</text>
  <text x="480" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Zero-trust practices, sensitive variables, state encryption &amp; secrets hygiene</text>

  <!-- Left: The Security Dangers -->
  <g transform="translate(60, 110)" filter="url(#shadow17)">
    <rect width="400" height="380" rx="14" fill="#1e182e" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="0" y="0" width="400" height="42" rx="14" fill="#ef4444"/>
    <text x="200" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🚨 Critical Security Risks</text>

    <text x="25" y="75" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. Plaintext in terraform.tfstate</text>
    <text x="25" y="98" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Terraform state stores database passwords, private keys,</text>
    <text x="25" y="116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">and tokens in UNENCRYPTED plain text JSON format!</text>

    <text x="25" y="150" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. Accidental Git Commits</text>
    <text x="25" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Committing .tfvars or .tfstate files to GitHub leaks</text>
    <text x="25" y="191" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">cloud admin credentials to public scrapers within seconds.</text>

    <text x="25" y="225" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. Overprivileged IAM Roles</text>
    <text x="25" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Using AdministratorAccess for CI/CD runners allows</text>
    <text x="25" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">rogue scripts to compromise the entire AWS cloud account.</text>

    <rect x="20" y="295" width="360" height="65" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
    <text x="200" y="322" fill="#fecaca" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ Sensitive = true ONLY masks CLI stdout,</text>
    <text x="200" y="342" fill="#fecaca" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">it does NOT encrypt state file storage!</text>
  </g>

  <!-- Right: The Defense Architecture -->
  <g transform="translate(500, 110)" filter="url(#shadow17)">
    <rect width="400" height="380" rx="14" fill="#1e182e" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="400" height="42" rx="14" fill="#10b981"/>
    <text x="200" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🛡️ Enterprise Defense In Depth</text>

    <text x="25" y="75" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">1. Dedicated Secrets Managers</text>
    <text x="25" y="98" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Fetch credentials dynamically via AWS Secrets Manager,</text>
    <text x="25" y="116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">SSM Parameter Store, or HashiCorp Vault data sources.</text>

    <text x="25" y="150" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">2. KMS Encrypted Remote State</text>
    <text x="25" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Store state exclusively in S3 with SSE-KMS, TLS enforcement,</text>
    <text x="25" y="191" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">and strict bucket policies denying non-CI/CD access.</text>

    <text x="25" y="225" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3. OIDC Short-Lived Credentials</text>
    <text x="25" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Authenticate GitHub Actions / GitLab CI via AWS IAM OIDC</text>
    <text x="25" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">without long-lived static AWS Access Keys!</text>

    <rect x="20" y="295" width="360" height="65" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="200" y="322" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✅ Pre-Commit Hooks &amp; tfsec / trivy</text>
    <text x="200" y="342" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Scan for leaked keys and misconfigs automatically!</text>
  </g>
</svg>
