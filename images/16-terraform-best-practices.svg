<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b29" />
      <stop offset="100%" stop-color="#142c42" />
    </linearGradient>
    <filter id="shadow16" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg16)" />

  <text x="480" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">🏆 Terraform Production Best Practices</text>
  <text x="480" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Core pillars of scalable, resilient, and collaborative Infrastructure as Code</text>

  <!-- Pillar 1: Code Structure -->
  <g transform="translate(50, 105)" filter="url(#shadow16)">
    <rect width="265" height="185" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="132" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">📁 Standard File Layout</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="monospace" font-size="12">• main.tf (resources)</text>
    <text x="20" y="90" fill="#e2e8f0" font-family="monospace" font-size="12">• variables.tf (typed inputs)</text>
    <text x="20" y="115" fill="#e2e8f0" font-family="monospace" font-size="12">• outputs.tf (exports)</text>
    <text x="20" y="140" fill="#e2e8f0" font-family="monospace" font-size="12">• versions.tf (pinned)</text>
    <text x="20" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Always run terraform fmt!</text>
  </g>

  <!-- Pillar 2: Version Pinning -->
  <g transform="translate(345, 105)" filter="url(#shadow16)">
    <rect width="265" height="185" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="132" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">📌 Strict Version Pinning</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="monospace" font-size="12">• required_version ">= 1.8"</text>
    <text x="20" y="90" fill="#e2e8f0" font-family="monospace" font-size="12">• provider version "~> 5.0"</text>
    <text x="20" y="115" fill="#e2e8f0" font-family="monospace" font-size="12">• Commit .terraform.lock.hcl</text>
    <text x="20" y="140" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Guarantees deterministic</text>
    <text x="20" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">reproducible deployments</text>
  </g>

  <!-- Pillar 3: Small State Blasts -->
  <g transform="translate(640, 105)" filter="url(#shadow16)">
    <rect width="270" height="185" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="135" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">💥 Limit Blast Radius</text>
    <text x="20" y="65" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Split monolithic repos</text>
    <text x="20" y="90" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Separate networking &amp; app</text>
    <text x="20" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Separate DB from web tier</text>
    <text x="20" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Prevents accidental whole-stack</text>
    <text x="20" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">outages during applies</text>
  </g>

  <!-- Pillar 4: Plan First & CI/CD -->
  <g transform="translate(50, 315)" filter="url(#shadow16)">
    <rect width="415" height="190" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="207" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🔍 Always Review Plans in CI/CD</text>
    <text x="20" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. Pull Requests trigger <tspan fill="#38bdf8" font-family="monospace">terraform plan -out=tfplan</tspan></text>
    <text x="20" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">2. Peer review verifies additions (+), changes (~), destructions (-)</text>
    <text x="20" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">3. Merge triggers <tspan fill="#34d399" font-family="monospace">terraform apply tfplan</tspan> automatically</text>
    <text x="20" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12">⚠️ Never apply directly from local developer laptops in prod!</text>
  </g>

  <!-- Pillar 5: Drift & Tagging -->
  <g transform="translate(495, 315)" filter="url(#shadow16)">
    <rect width="415" height="190" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="207" y="32" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🏷️ Tagging Standards &amp; Drift Detection</text>
    <text x="20" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Apply <tspan font-family="monospace" fill="#38bdf8">default_tags</tspan> on provider (Environment, Owner, Project)</text>
    <text x="20" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Run scheduled drift checks with <tspan font-family="monospace" fill="#38bdf8">terraform plan -detailed-exitcode</tspan></text>
    <text x="20" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Disallow manual AWS Console clicks (No "ClickOps" allowed)</text>
    <text x="20" y="145" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">💡 State integrity = Infrastructure security &amp; auditability!</text>
  </g>
</svg>
