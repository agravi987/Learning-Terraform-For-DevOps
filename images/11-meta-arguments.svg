<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)" />

  <text x="480" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">⚙️ Terraform Meta-Arguments Architecture</text>
  <text x="480" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Special arguments that change how Terraform controls, scales, and manages resources</text>

  <!-- Card 1: depends_on -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="410" height="175" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="16" y="16" width="120" height="28" rx="6" fill="#6366f1" />
    <text x="76" y="35" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">depends_on</text>
    <text x="150" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Explicit Dependencies</text>
    <text x="20" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Forces execution order when Terraform can't infer it.</text>
    <rect x="20" y="92" width="370" height="65" rx="8" fill="#090d16" />
    <text x="32" y="115" fill="#a5b4fc" font-family="monospace" font-size="12">depends_on = [</text>
    <text x="50" y="133" fill="#38bdf8" font-family="monospace" font-size="12">  aws_iam_role_policy.example</text>
    <text x="32" y="148" fill="#a5b4fc" font-family="monospace" font-size="12">]</text>
  </g>

  <!-- Card 2: count vs for_each -->
  <g transform="translate(490, 110)" filter="url(#shadow)">
    <rect width="430" height="175" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="16" y="16" width="150" height="28" rx="6" fill="#10b981" />
    <text x="91" y="35" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">count / for_each</text>
    <text x="180" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Resource Scaling</text>
    <text x="20" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">count: index [0,1,2] | for_each: map/set keys ["web","db"]</text>
    <rect x="20" y="92" width="390" height="65" rx="8" fill="#090d16" />
    <text x="32" y="115" fill="#34d399" font-family="monospace" font-size="12">count = 3  # uses count.index</text>
    <text x="32" y="133" fill="#38bdf8" font-family="monospace" font-size="12">for_each = toset(["east", "west"])</text>
    <text x="32" y="148" fill="#94a3b8" font-family="monospace" font-size="11"># each.key, each.value</text>
  </g>

  <!-- Card 3: lifecycle -->
  <g transform="translate(40, 315)" filter="url(#shadow)">
    <rect width="410" height="185" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="16" y="16" width="90" height="28" rx="6" fill="#f59e0b" />
    <text x="61" y="35" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">lifecycle</text>
    <text x="120" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Behavior Control Rules</text>
    <text x="20" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Customize default resource destruction and replacement:</text>
    <rect x="20" y="90" width="370" height="85" rx="8" fill="#090d16" />
    <text x="32" y="110" fill="#fbbf24" font-family="monospace" font-size="11">• create_before_destroy = true (Zero downtime)</text>
    <text x="32" y="130" fill="#f87171" font-family="monospace" font-size="11">• prevent_destroy = true (Guard production DB)</text>
    <text x="32" y="150" fill="#38bdf8" font-family="monospace" font-size="11">• ignore_changes = [tags] (Ignore external drift)</text>
  </g>

  <!-- Card 4: provider meta-argument -->
  <g transform="translate(490, 315)" filter="url(#shadow)">
    <rect width="430" height="185" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2"/>
    <rect x="16" y="16" width="90" height="28" rx="6" fill="#ec4899" />
    <text x="61" y="35" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">provider</text>
    <text x="120" y="35" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Multi-Region &amp; Aliases</text>
    <text x="20" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Assign specific provider alias instances to resources:</text>
    <rect x="20" y="90" width="390" height="85" rx="8" fill="#090d16" />
    <text x="32" y="112" fill="#f472b6" font-family="monospace" font-size="12">resource "aws_s3_bucket" "dr_replica" {</text>
    <text x="50" y="132" fill="#38bdf8" font-family="monospace" font-size="12">  provider = aws.secondary  # aliased provider</text>
    <text x="50" y="150" fill="#94a3b8" font-family="monospace" font-size="12">  bucket   = "disaster-recovery-backup"</text>
    <text x="32" y="167" fill="#f472b6" font-family="monospace" font-size="12">}</text>
  </g>
</svg>
